name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 22.x]          # ✅ Supported Node versions
        browser: [chromium, firefox, webkit] # ✅ Browser matrix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests on ${{ matrix.browser }}
        run: npx playwright test --browser=${{ matrix.browser }} --reporter=html --output=results/${{ matrix.node-version }}-${{ matrix.browser }}

      - name: Upload per-job results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.node-version }}-${{ matrix.browser }}
          path: results/${{ matrix.node-version }}-${{ matrix.browser }}

  merge-report:
    needs: unit-tests
    runs-on: ubuntu-latest
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html results/*

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report

      - name: Deploy merged report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
